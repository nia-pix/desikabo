<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="制作物をご紹介">
    <title>自分のポートフォリオ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            font-family: "Doto", sans-serif;
        }

        /* 背景動画 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* h1, h2のスタイルとアニメーション */
        h1, h2 {
            font-family: "Doto", serif;
            font-weight: 600;
            font-size: 400%;
            color: hotpink;
            margin-bottom: 4px;
            line-height: 0.4;
            padding-left: 50px;
            text-shadow: 2px 2px 4px black; /* 黒い縁取り */
            opacity: 0;
            transform: translateY(-100px);
            animation: drop 1s ease-out forwards;
        }

        h1 { animation-delay: 0s; }
        h2 { animation-delay: 0.5s; }

        @keyframes drop {
            0% { opacity: 0; transform: translateY(-100px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* メニューのデザイン */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border: none;
            z-index: 10;
            transition: box-shadow 0.3s ease-in-out;
        }

        .menu-button:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); /* 光るエフェクト */
        }

        .menu {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding-top: 60px;
            transition: left 0.3s ease-in-out;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 20px;
        }

        .menu.active { left: 0; }

        /* Worksメニューとサブメニュー */
        .works-toggle {
            cursor: pointer;
            font-size: 20px;
            color: white;
            padding: 10px;
            text-decoration: none;
            display: block;
        }

        .submenu {
            display: none;
            padding-left: 20px;
            background: rgba(0, 0, 0, 0.8);
        }

        .submenu a {
            display: block;
            padding: 5px 15px;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .submenu.active { display: block; }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop>
        <source src="0001-0120.mp4" type="video/mp4">
        お使いのブラウザは動画をサポートしていません。
    </video>

    <div class="menu-button" onclick="toggleMenu()">
        <span class="menu-icon">☰</span>
    </div>

    <nav class="menu">
        <a href="Untitled-1.html">Home</a>
        <a href="#" class="works-toggle">Works ▼</a>
        <div class="submenu">
            <a href="graphicdesign.html">Graphic Design</a>
            <a href="photography.html">Photography</a>
        </div>
        <nav>
        <a href="contact.html">Contact</a><!-- 追加 -->
</nav>
    </nav>

    <script>
        function toggleMenu() {
            let menu = document.querySelector(".menu");
            let icon = document.querySelector(".menu-icon");
            menu.classList.toggle("active");
            icon.innerHTML = menu.classList.contains("active") ? "×" : "☰";
        }

        document.addEventListener("DOMContentLoaded", function() {
            let worksToggle = document.querySelector(".works-toggle");
            let submenu = document.querySelector(".submenu");

            worksToggle.addEventListener("click", function(event) {
                event.preventDefault();
                submenu.classList.toggle("active");
            });
        });
    </script>

    <h1>Design</h1>
    <h2>Portfolio</h2>
</body>
</html>
