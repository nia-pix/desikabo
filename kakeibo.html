<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="シンプルな家計簿・貯金アプリ">
<title>家計簿・貯金</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #22201c;
    --muted: #77736b;
    --line: #e4e1da;
    --accent: #2f7d68;
    --accent-soft: #e2f0eb;
    --income: #2f6fbf;
    --expense: #c4513a;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #211f1d;
      --text: #ecebe7;
      --muted: #9e9a92;
      --line: #34312d;
      --accent: #5cc0a2;
      --accent-soft: #1f3a32;
      --income: #6fa8f0;
      --expense: #ec8670;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 80px;
  }
  header {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 { font-size: 20px; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav span { min-width: 92px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .income { color: var(--income); }
  .expense { color: var(--expense); }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .bar.over > div { background: var(--expense); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .small { font-size: 12px; color: var(--muted); }
  button, .btn {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { button.primary { color: #10201b; } }
  button.icon { padding: 6px 10px; }
  button.danger { color: var(--expense); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form.grid .full { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    width: 100%;
    min-width: 0;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button.on[data-type="expense"] { background: var(--expense); color: #fff; }
  .seg button.on[data-type="income"] { background: var(--income); color: #fff; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .donut-wrap svg { flex: none; }
  .legend { flex: 1; min-width: 180px; }
  .legend li { padding: 6px 0 !important; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 5;
  }
  nav.tabs button { border: 0; border-radius: 0; background: transparent; padding: 12px 4px; color: var(--muted); font-size: 13px; }
  nav.tabs button.on { color: var(--accent); font-weight: 700; }
  section[hidden] { display: none; }
  .goal { padding: 12px 0; border-top: 1px solid var(--line); }
  .goal:first-of-type { border-top: 0; }
  .goal .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
  .bars svg text { fill: var(--muted); font-size: 11px; }
  .toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 420px) {
    .stat .value { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>家計簿・貯金</h1>
  <div class="month-nav">
    <button class="icon" id="prevMonth" aria-label="前の月">‹</button>
    <span id="monthLabel"></span>
    <button class="icon" id="nextMonth" aria-label="次の月">›</button>
  </div>
</header>

<main>
  <!-- ホーム -->
  <section id="tab-home">
    <div class="card">
      <div class="stats">
        <div class="stat"><div class="label">収入</div><div class="value income" id="sumIncome"></div></div>
        <div class="stat"><div class="label">支出</div><div class="value expense" id="sumExpense"></div></div>
        <div class="stat"><div class="label">収支</div><div class="value" id="sumBalance"></div></div>
      </div>
    </div>

    <div class="card" id="budgetCard">
      <div class="row"><h2 style="margin:0">今月の予算</h2><span class="small" id="budgetText"></span></div>
      <div class="bar" id="budgetBar" style="margin-top:10px"><div></div></div>
      <div class="small" id="budgetRemain" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <h2>カテゴリ別の支出</h2>
      <div id="donut"></div>
    </div>

    <div class="card">
      <h2>過去6か月の推移</h2>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card">
      <h2>貯金の合計</h2>
      <div class="row">
        <div class="stat"><div class="value" id="savingsTotal"></div></div>
        <button id="goSavings">貯金を見る</button>
      </div>
    </div>
  </section>

  <!-- 記録 -->
  <section id="tab-record" hidden>
    <div class="card">
      <h2 id="formTitle">記録する</h2>
      <form class="grid" id="txForm" autocomplete="off">
        <div class="seg full" role="group" aria-label="種類">
          <button type="button" data-type="expense" class="on">支出</button>
          <button type="button" data-type="income">収入</button>
        </div>
        <label class="full">金額（円）
          <input type="number" id="txAmount" inputmode="numeric" min="1" step="1" required placeholder="1000">
        </label>
        <label>カテゴリ
          <select id="txCategory"></select>
        </label>
        <label>日付
          <input type="date" id="txDate" required>
        </label>
        <label class="full">メモ
          <input type="text" id="txMemo" maxlength="60" placeholder="任意">
        </label>
        <div class="full row" style="justify-content:flex-end">
          <button type="button" id="txCancel" hidden>キャンセル</button>
          <button type="submit" class="primary" id="txSubmit">追加</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <h2 style="margin:0">この月の記録</h2>
        <select id="filterCat" style="width:auto"></select>
      </div>
      <ul class="list" id="txList"></ul>
    </div>
  </section>

  <!-- 貯金 -->
  <section id="tab-savings" hidden>
    <div class="card">
      <h2>貯金目標を作る</h2>
      <form class="grid" id="goalForm" autocomplete="off">
        <label class="full">目標の名前
          <input type="text" id="goalName" required maxlength="30" placeholder="旅行、PC、緊急用資金など">
        </label>
        <label>目標金額（円）
          <input type="number" id="goalTarget" min="1" step="1" required inputmode="numeric">
        </label>
        <label>期限（任意）
          <input type="date" id="goalDeadline">
        </label>
        <div class="full row" style="justify-content:flex-end">
          <button type="submit" class="primary">作成</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>目標一覧</h2>
      <div id="goalList"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" hidden>
    <div class="card">
      <h2>月の予算</h2>
      <form class="row" id="budgetForm">
        <input type="number" id="budgetInput" min="0" step="1" inputmode="numeric" placeholder="例: 150000">
        <button type="submit" class="primary">保存</button>
      </form>
      <p class="small">0 または空欄で予算を使わない設定になります。</p>
    </div>
    <div class="card">
      <h2>カテゴリ</h2>
      <div class="small" style="margin-bottom:6px">支出</div>
      <div class="chips" id="catExpense"></div>
      <div class="small" style="margin:12px 0 6px">収入</div>
      <div class="chips" id="catIncome"></div>
      <form class="row" id="catForm" style="margin-top:12px">
        <select id="catType" style="width:auto">
          <option value="expense">支出</option>
          <option value="income">収入</option>
        </select>
        <input type="text" id="catName" maxlength="12" placeholder="新しいカテゴリ" required>
        <button type="submit">追加</button>
      </form>
      <p class="small">カテゴリを押すと削除できます（記録済みのデータは残ります）。</p>
    </div>
    <div class="card">
      <h2>データ</h2>
      <p class="small" style="margin-top:0">データはこのブラウザの中だけに保存されます。機種変更やブラウザのデータ削除に備えて、ときどきバックアップしてください。</p>
      <div class="chips">
        <button id="exportCsv">CSVで書き出し</button>
        <button id="exportJson">バックアップ保存</button>
        <button id="importJson">バックアップから復元</button>
        <button id="resetAll" class="danger">全データを削除</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="画面切り替え">
  <button data-tab="home" class="on">ホーム</button>
  <button data-tab="record">記録</button>
  <button data-tab="savings">貯金</button>
  <button data-tab="settings">設定</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const KEY = 'kakeibo-v1';
  const PALETTE = ['#2f7d68','#e07a5f','#d49a2a','#8a5cb8','#3a9fb0','#b8577f','#6b8f3a','#8c7a5b','#5f6b7a','#c9a227'];
  const DEFAULT = {
    tx: [],
    goals: [],
    budget: 0,
    categories: {
      expense: ['食費','日用品','住居','水道光熱','通信','交通','医療','趣味・娯楽','交際費','衣服','その他'],
      income: ['給与','副業','賞与','臨時収入','その他']
    }
  };

  const $ = s => document.querySelector(s);
  const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = n => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let state = load();
  const now = new Date();
  let viewY = now.getFullYear(), viewM = now.getMonth();
  let txType = 'expense';
  let editingId = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        return { ...structuredClone(DEFAULT), ...d, categories: { ...DEFAULT.categories, ...(d.categories || {}) } };
      }
    } catch (e) { /* 読み込めない場合は初期状態 */ }
    return structuredClone(DEFAULT);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('保存できませんでした（ブラウザの設定を確認してください）'); }
  }
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  const catColor = name => {
    const list = state.categories.expense;
    const i = list.indexOf(name);
    if (i >= 0) return PALETTE[i % PALETTE.length];
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };
  const monthTx = (y = viewY, m = viewM) => {
    const k = monthKey(y, m);
    return state.tx.filter(t => t.date.startsWith(k));
  };
  const sums = list => list.reduce((a, t) => { a[t.type] += t.amount; return a; }, { income: 0, expense: 0 });

  // ---------- タブ ----------
  function showTab(name) {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + name);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('#goSavings').addEventListener('click', () => showTab('savings'));

  // ---------- 月の切り替え ----------
  $('#prevMonth').addEventListener('click', () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); });
  $('#nextMonth').addEventListener('click', () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); });

  // ---------- ホーム ----------
  function renderHome() {
    const list = monthTx();
    const s = sums(list);
    const bal = s.income - s.expense;
    $('#sumIncome').textContent = yen(s.income);
    $('#sumExpense').textContent = yen(s.expense);
    const balEl = $('#sumBalance');
    balEl.textContent = (bal > 0 ? '+' : '') + yen(bal).replace('¥-', '-¥');
    balEl.className = 'value ' + (bal >= 0 ? 'income' : 'expense');

    // 予算
    const card = $('#budgetCard');
    if (state.budget > 0) {
      card.hidden = false;
      const pct = Math.min(100, s.expense / state.budget * 100);
      $('#budgetBar').classList.toggle('over', s.expense > state.budget);
      $('#budgetBar > div').style.width = pct + '%';
      $('#budgetText').textContent = `${yen(s.expense)} / ${yen(state.budget)}`;
      const remain = state.budget - s.expense;
      $('#budgetRemain').textContent = remain >= 0 ? `残り ${yen(remain)}` : `${yen(-remain)} オーバー`;
    } else {
      card.hidden = true;
    }

    // ドーナツ
    const byCat = {};
    list.filter(t => t.type === 'expense').forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const donut = $('#donut');
    if (!entries.length) {
      donut.innerHTML = '<div class="empty">この月の支出はまだありません</div>';
    } else {
      const total = s.expense, R = 60, r = 38, C = 2 * Math.PI;
      let a0 = -Math.PI / 2, paths = '';
      entries.forEach(([cat, v]) => {
        const frac = v / total;
        if (frac >= 0.9999) {
          paths += `<circle cx="70" cy="70" r="${(R + r) / 2}" fill="none" stroke="${catColor(cat)}" stroke-width="${R - r}"/>`;
          return;
        }
        const a1 = a0 + frac * C;
        const large = frac > 0.5 ? 1 : 0;
        const p = (rad, a) => `${70 + rad * Math.cos(a)},${70 + rad * Math.sin(a)}`;
        paths += `<path d="M${p(R,a0)} A${R},${R} 0 ${large} 1 ${p(R,a1)} L${p(r,a1)} A${r},${r} 0 ${large} 0 ${p(r,a0)}Z" fill="${catColor(cat)}" stroke="var(--card)" stroke-width="2"><title>${esc(cat)} ${yen(v)}</title></path>`;
        a0 = a1;
      });
      donut.innerHTML = `<div class="donut-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="カテゴリ別支出">${paths}
          <text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--muted)">支出</text>
          <text x="70" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${yen(total)}</text>
        </svg>
        <ul class="list legend">${entries.map(([cat, v]) => `
          <li><span class="dot" style="background:${catColor(cat)}"></span>
            <span class="grow ellipsis">${esc(cat)}</span>
            <span class="small">${Math.round(v / total * 100)}%</span>
            <span class="amount">${yen(v)}</span></li>`).join('')}
        </ul></div>`;
    }

    // 6か月推移
    const months = [];
    for (let i = 5; i >= 0; i--) {
      let y = viewY, m = viewM - i;
      while (m < 0) { m += 12; y--; }
      months.push({ y, m, ...sums(monthTx(y, m)) });
    }
    const max = Math.max(1, ...months.flatMap(o => [o.income, o.expense]));
    const W = 320, H = 150, base = 128, colW = W / 6, bw = 14;
    let svg = '';
    months.forEach((o, i) => {
      const x = i * colW + colW / 2;
      const hi = o.income / max * 110, he = o.expense / max * 110;
      svg += `<rect x="${x - bw - 1}" y="${base - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--income)"><title>${o.m + 1}月 収入 ${yen(o.income)}</title></rect>`;
      svg += `<rect x="${x + 1}" y="${base - he}" width="${bw}" height="${he}" rx="3" fill="var(--expense)"><title>${o.m + 1}月 支出 ${yen(o.expense)}</title></rect>`;
      svg += `<text x="${x}" y="${H - 4}" text-anchor="middle"${o.y === viewY && o.m === viewM ? ' style="font-weight:700;fill:var(--text)"' : ''}>${o.m + 1}月</text>`;
    });
    svg += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
    $('#bars').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="過去6か月の収入と支出">${svg}</svg>
      <div class="chips small" style="margin-top:4px"><span><span class="dot" style="display:inline-block;background:var(--income)"></span> 収入</span><span><span class="dot" style="display:inline-block;background:var(--expense)"></span> 支出</span></div>`;

    $('#savingsTotal').textContent = yen(state.goals.reduce((a, g) => a + g.saved, 0));
  }

  // ---------- 記録 ----------
  function fillCategorySelect(selected) {
    const sel = $('#txCategory');
    const cats = state.categories[txType];
    sel.innerHTML = cats.map(c => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');
    if (selected && !cats.includes(selected)) sel.insertAdjacentHTML('beforeend', `<option selected>${esc(selected)}</option>`);
  }
  function setType(t, selected) {
    txType = t;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.type === t));
    fillCategorySelect(selected);
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));

  function resetForm() {
    editingId = null;
    $('#txForm').reset();
    $('#txDate').value = defaultDate();
    $('#formTitle').textContent = '記録する';
    $('#txSubmit').textContent = '追加';
    $('#txCancel').hidden = true;
    setType(txType);
  }
  function defaultDate() {
    const t = todayStr();
    return t.startsWith(monthKey(viewY, viewM)) ? t : `${monthKey(viewY, viewM)}-01`;
  }

  $('#txForm').addEventListener('submit', e => {
    e.preventDefault();
    const amount = Math.round(Number($('#txAmount').value));
    if (!(amount > 0)) { toast('金額を入力してください'); return; }
    const data = { type: txType, amount, category: $('#txCategory').value, date: $('#txDate').value, memo: $('#txMemo').value.trim() };
    if (editingId) {
      Object.assign(state.tx.find(t => t.id === editingId), data);
      toast('更新しました');
    } else {
      state.tx.push({ id: uid(), ...data });
      toast((txType === 'expense' ? '支出' : '収入') + 'を追加しました');
    }
    save();
    const [y, m] = data.date.split('-').map(Number);
    viewY = y; viewM = m - 1;
    resetForm();
    render();
    $('#txAmount').focus();
  });
  $('#txCancel').addEventListener('click', resetForm);

  function renderRecord() {
    const fSel = $('#filterCat');
    const cur = fSel.value;
    const list = monthTx().sort((a, b) => b.date.localeCompare(a.date) || 0);
    const cats = [...new Set(list.map(t => t.category))];
    fSel.innerHTML = '<option value="">すべて</option>' + cats.map(c => `<option${c === cur ? ' selected' : ''}>${esc(c)}</option>`).join('');
    const shown = fSel.value ? list.filter(t => t.category === fSel.value) : list;
    const ul = $('#txList');
    if (!shown.length) { ul.innerHTML = '<li class="empty" style="display:block">記録がありません</li>'; return; }
    ul.innerHTML = shown.map(t => `
      <li>
        <span class="dot" style="background:${t.type === 'income' ? 'var(--income)' : catColor(t.category)}"></span>
        <div class="grow">
          <div class="ellipsis">${esc(t.category)}${t.memo ? ' <span class="small">' + esc(t.memo) + '</span>' : ''}</div>
          <div class="small">${t.date.slice(5).replace('-', '/')}</div>
        </div>
        <span class="amount ${t.type}">${t.type === 'income' ? '+' : '-'}${yen(t.amount)}</span>
        <button class="icon" data-edit="${t.id}" aria-label="編集">編集</button>
        <button class="icon danger" data-del="${t.id}" aria-label="削除">×</button>
      </li>`).join('');
  }
  $('#filterCat').addEventListener('change', renderRecord);
  $('#txList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]'), ed = e.target.closest('[data-edit]');
    if (del) {
      if (!confirm('この記録を削除しますか？')) return;
      state.tx = state.tx.filter(t => t.id !== del.dataset.del);
      if (editingId === del.dataset.del) resetForm();
      save(); render(); toast('削除しました');
    } else if (ed) {
      const t = state.tx.find(x => x.id === ed.dataset.edit);
      editingId = t.id;
      setType(t.type, t.category);
      $('#txAmount').value = t.amount;
      $('#txDate').value = t.date;
      $('#txMemo').value = t.memo || '';
      $('#formTitle').textContent = '記録を編集';
      $('#txSubmit').textContent = '更新';
      $('#txCancel').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('#txAmount').focus();
    }
  });

  // ---------- 貯金 ----------
  $('#goalForm').addEventListener('submit', e => {
    e.preventDefault();
    const target = Math.round(Number($('#goalTarget').value));
    if (!(target > 0)) return;
    state.goals.push({ id: uid(), name: $('#goalName').value.trim(), target, saved: 0, deadline: $('#goalDeadline').value || '', history: [] });
    save(); e.target.reset(); render(); toast('目標を作成しました');
  });

  function renderSavings() {
    const box = $('#goalList');
    if (!state.goals.length) { box.innerHTML = '<div class="empty">まだ目標がありません。上のフォームから作成しましょう。</div>'; return; }
    box.innerHTML = state.goals.map(g => {
      const pct = Math.min(100, g.saved / g.target * 100);
      const remain = Math.max(0, g.target - g.saved);
      let hint = '';
      if (g.deadline && remain > 0) {
        const d = new Date(g.deadline + 'T00:00:00'), n = new Date();
        const monthsLeft = (d.getFullYear() - n.getFullYear()) * 12 + (d.getMonth() - n.getMonth());
        hint = monthsLeft > 0
          ? `期限 ${g.deadline.replace(/-/g, '/')}・あと${monthsLeft}か月 → 月 ${yen(Math.ceil(remain / monthsLeft))} ずつ`
          : (d >= new Date(todayStr() + 'T00:00:00') ? `期限 ${g.deadline.replace(/-/g, '/')}（今月中）` : `期限 ${g.deadline.replace(/-/g, '/')} を過ぎています`);
      } else if (g.deadline) {
        hint = `期限 ${g.deadline.replace(/-/g, '/')}`;
      }
      return `<div class="goal">
        <div class="row"><strong class="ellipsis">${esc(g.name)}</strong><span class="small">${Math.floor(pct)}%</span></div>
        <div class="row" style="margin:4px 0 6px"><span class="amount">${yen(g.saved)}</span><span class="small">目標 ${yen(g.target)}</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="small" style="margin-top:6px">${remain > 0 ? `あと ${yen(remain)}` : '🎉 達成しました！'}${hint ? '　' + hint : ''}</div>
        <div class="actions">
          <button class="primary" data-dep="${g.id}">入金</button>
          <button data-wd="${g.id}">引き出し</button>
          <button class="danger" data-gdel="${g.id}">削除</button>
        </div>
      </div>`;
    }).join('');
  }
  $('#goalList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.dep || b.dataset.wd || b.dataset.gdel;
    const g = state.goals.find(x => x.id === id); if (!g) return;
    if (b.dataset.gdel) {
      if (!confirm(`「${g.name}」を削除しますか？`)) return;
      state.goals = state.goals.filter(x => x.id !== id);
      save(); render(); return;
    }
    const isDep = !!b.dataset.dep;
    const v = prompt(isDep ? `「${g.name}」に入金する金額` : `「${g.name}」から引き出す金額`, '');
    if (v === null) return;
    let n = Math.round(Number(String(v).replace(/[,，¥円\s]/g, '')));
    if (!(n > 0)) { toast('正しい金額を入力してください'); return; }
    if (!isDep) n = -Math.min(n, g.saved);
    g.saved += n;
    (g.history = g.history || []).push({ date: todayStr(), amount: n });
    save(); render();
    toast(isDep ? `${yen(n)} 入金しました` : `${yen(-n)} 引き出しました`);
  });

  // ---------- 設定 ----------
  $('#budgetForm').addEventListener('submit', e => {
    e.preventDefault();
    state.budget = Math.max(0, Math.round(Number($('#budgetInput').value) || 0));
    save(); render(); toast('予算を保存しました');
  });
  function renderSettings() {
    $('#budgetInput').value = state.budget || '';
    for (const type of ['expense', 'income']) {
      $(type === 'expense' ? '#catExpense' : '#catIncome').innerHTML = state.categories[type]
        .map(c => `<button class="chip" data-cat="${esc(c)}" data-ctype="${type}" title="削除">${esc(c)} ×</button>`).join('');
    }
  }
  document.querySelector('#tab-settings').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    const list = state.categories[b.dataset.ctype];
    if (list.length <= 1) { toast('カテゴリは最低1つ必要です'); return; }
    if (!confirm(`カテゴリ「${b.dataset.cat}」を削除しますか？`)) return;
    state.categories[b.dataset.ctype] = list.filter(c => c !== b.dataset.cat);
    save(); render();
  });
  $('#catForm').addEventListener('submit', e => {
    e.preventDefault();
    const type = $('#catType').value, name = $('#catName').value.trim();
    if (!name) return;
    if (state.categories[type].includes(name)) { toast('同じ名前のカテゴリがあります'); return; }
    state.categories[type].push(name);
    $('#catName').value = '';
    save(); render(); toast('カテゴリを追加しました');
  });

  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#exportCsv').addEventListener('click', () => {
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const rows = [['日付','種類','カテゴリ','金額','メモ']].concat(
      [...state.tx].sort((a, b) => a.date.localeCompare(b.date))
        .map(t => [t.date, t.type === 'income' ? '収入' : '支出', t.category, t.amount, t.memo || '']));
    download(`kakeibo-${todayStr()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
  });
  $('#exportJson').addEventListener('click', () => {
    download(`kakeibo-backup-${todayStr()}.json`, JSON.stringify(state, null, 2), 'application/json');
  });
  $('#importJson').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.tx) || !Array.isArray(d.goals)) throw new Error();
      if (!confirm('現在のデータを置き換えて復元しますか？')) return;
      state = { ...structuredClone(DEFAULT), ...d, categories: { ...DEFAULT.categories, ...(d.categories || {}) } };
      save(); render(); toast('復元しました');
    } catch { toast('ファイルを読み込めませんでした'); }
    finally { e.target.value = ''; }
  });
  $('#resetAll').addEventListener('click', () => {
    if (!confirm('すべての記録と貯金目標を削除します。元に戻せません。よろしいですか？')) return;
    state = structuredClone(DEFAULT);
    save(); render(); toast('削除しました');
  });

  // ---------- 描画 ----------
  function render() {
    $('#monthLabel').textContent = `${viewY}年${viewM + 1}月`;
    renderHome();
    renderRecord();
    renderSavings();
    renderSettings();
    if (!editingId) $('#txDate').value = defaultDate();
  }

  setType('expense');
  render();
})();
</script>
</body>
</html>
